# Export of repo-settings into starter/repo-settings/. Built from the
# inventory (scratch manifests/repo-settings.yml, 2026-10-29) as amended by
# DECISIONS.md: every fleet.yml element is kept with names substituted (the
# tests pin the shipped file), the platform label-only mechanism (ADR 0016)
# is kept with invented names (C3), the two owner legs of the workflow keep
# their shape with the owners substituted (C9), and the scheduled-run-health
# caller points at the copy in _agent-guidance (C4).
repo: repo-settings
kit_name: repo-settings
source: repo-settings
source_sha: b63c70a5e0e92527176074273bb02f2eb5e9d66a
# Its sync-delivered files (AGENTS.md managed half, the fleet payload mirror)
# are rebuilt from the exported _agent-guidance.
after: [_agent-guidance]

edits:
  # ---- C4: the scheduled-run-health caller names a placeholder commit of _agent-guidance's copy
  - path: .github/workflows/scheduled-run-health.yml
    old: "    uses: Adam-S-Daniel/_agent-guidance/.github/workflows/scheduled-run-health-reusable.yml@725400664dd84021b3fcd717e213e5994d0b20ff\n"
    new: "    uses: Adam-S-Daniel/_agent-guidance/.github/workflows/scheduled-run-health-reusable.yml@0000000000000000000000000000000000000000\n"
    why: >-
      C4. The source calls _agent-guidance's copy at a commit of the source
      owner's repo, which the adopter's does not have. A cross-repo reusable
      takes a full commit sha and the adopter's _agent-guidance commit does
      not exist yet, so this is a placeholder sha the adopter replaces with
      the command in REGENERATE.md.
  - path: .github/workflows/scheduled-run-health.yml
    old: "The platform owns\n# the audit logic; this thin caller schedules it."
    new: "_agent-guidance's\n# scheduled-run-health-reusable.yml owns the audit logic; this thin caller\n# schedules it."
    why: C4. The audit logic lives in _agent-guidance.
  - path: .github/workflows/scheduled-run-health.yml
    old: "    # The audit scripts still come from cms-platform, at the release named\n    # in _agent-guidance's .github/health-audit-platform-ref.\n"
    new: "    # The audit script is copied into _agent-guidance too (the adoption\n    # kit's DECISIONS C4).\n"
    why: C4. The kit has no platform repo and no release pin; the script lives in _agent-guidance.

  # ---- Base-only track, review fix (DECISIONS "Base-only track runs green"):
  # no schedule until regenerate.sh run-health-sha pins the reusable.
  - path: .github/workflows/scheduled-run-health.yml
    stage: output
    old: |
      on:
        schedule:
          # Off-peak offset minute (house precedent). GitHub cron lag (measured
          # 4-5h on daily crons) is absorbed by the reusable's 48h scan window.
          - cron: '47 8 * * *'
        workflow_dispatch:
    new: |
      on:
        # The schedule starts with the pin: bootstrap/regenerate.sh run-health-sha
        # replaces the forty-zero sha below and turns the next line into the daily
        # schedule (47 8 * * *, an off-peak minute; GitHub's cron lag is absorbed
        # by the reusable's 48h scan window). A schedule at the placeholder would
        # fail at "Set up job" every day until then.
        # schedule-starts-with-the-pin: - cron: '47 8 * * *'
        workflow_dispatch:
    why: 'kit departure: base-only track. The caller ships at a placeholder sha that only regenerate.sh (step 16) replaces, so its daily run failed from the starter merge until then; the schedule now arrives with the pin, in the same pull request.'

  # ---- Base-only track, review fix (DECISIONS "Base-only track runs green"):
  # the plan job before the settings-read App exists.
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Mint read-only GitHub App token for example-adopter
              id: token_example_adopter
              uses: actions/create-github-app-token@v3.3.0
    new: |2
            # Not set up yet, on the weekly schedule only: until create-apps.sh
            # has made the settings-read App and set its client id, a scheduled
            # plan has nothing to plan with, so a notice says so and it reports
            # no drift. A push or a dispatch still mints, and fails at the mint
            # without the App: a settings change must never read as "nothing to
            # apply".
            - name: Is the read App set up yet?
              id: read_app
              env:
                READ_APP_CLIENT_ID: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
              run: |
                if [[ -z "$READ_APP_CLIENT_ID" && "$GITHUB_EVENT_NAME" == schedule ]]; then
                  echo "::notice::not set up yet: variable REPO_SETTINGS_READ_APP_CLIENT_ID is not set, so the weekly plan planned nothing. bootstrap/create-apps.sh sets it when it creates the settings-read App (quick start step 6)."
                  echo "ready=false" >> "$GITHUB_OUTPUT"
                else
                  echo "ready=true" >> "$GITHUB_OUTPUT"
                fi

            - name: Mint read-only GitHub App token for example-adopter
              id: token_example_adopter
              if: steps.read_app.outputs.ready == 'true'
              uses: actions/create-github-app-token@v3.3.0
    why: 'kit departure: base-only track. The weekly plan minted from the settings-read App with no gate, so it was red every Monday from the starter merge (step 4) until create-apps.sh set the App up. Only the schedule skips with a notice; a push or dispatch keeps the source''s failure at the mint, so a deleted variable cannot make a settings change read as no drift.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
        # Not gated on the read App's variable, on purpose: a plan that skipped
        # would read as "nothing to apply" on push. A missing App fails the mint and
        # turns the plan red instead.
    new: |2
        # Not gated on the read App's variable on push or dispatch, on purpose: a
        # plan that skipped would read as "nothing to apply". A missing App fails
        # the mint and turns the plan red instead. The kit's one exception is the
        # weekly schedule before the App exists (step "Is the read App set up
        # yet?" below): it skips with a notice, since nothing could be applied.
    why: 'kit departure: base-only track. The comment follows the schedule-only gate below.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Mint read-only GitHub App token for example-adopter-two
              id: token_example_adopter_two
              uses: actions/create-github-app-token@v3.3.0
    new: |2
            - name: Mint read-only GitHub App token for example-adopter-two
              id: token_example_adopter_two
              if: steps.read_app.outputs.ready == 'true'
              uses: actions/create-github-app-token@v3.3.0
    why: 'kit departure: base-only track. Gated like the first owner''s mint.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Plan for example-adopter
              id: plan_example_adopter
    new: |2
            - name: Plan for example-adopter
              id: plan_example_adopter
              if: steps.read_app.outputs.ready == 'true'
    why: 'kit departure: base-only track. No token to plan with until the read App is set up.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Plan for example-adopter-two
              id: plan_example_adopter_two
    new: |2
            - name: Plan for example-adopter-two
              id: plan_example_adopter_two
              if: steps.read_app.outputs.ready == 'true'
    why: 'kit departure: base-only track. No token to plan with until the read App is set up.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Which repos does fleet.yml not declare?
              id: coverage
              continue-on-error: true
    new: |2
            - name: Which repos does fleet.yml not declare?
              id: coverage
              if: steps.read_app.outputs.ready == 'true'
              continue-on-error: true
    why: 'kit departure: base-only track. Only the read App''s token can enumerate.'
  - path: .github/workflows/repo-settings.yml
    stage: output
    old: |2
            - name: Nudge on repos fleet.yml does not declare
              continue-on-error: true
    new: |2
            - name: Nudge on repos fleet.yml does not declare
              if: steps.read_app.outputs.ready == 'true'
              continue-on-error: true
    why: 'kit departure: base-only track. Nothing was enumerated to nudge about.'

  - path: .gitignore
    old: "pytest-cache*\n"
    new: "pytest-cache*\n# The adoption kit's copy-starter.sh skips these when it copies the tree;\n# ignoring them here keeps them out of the adopter's first commits too.\nnode_modules/\n.DS_Store\n"
    why: >-
      The kit's bootstrap test requires every starter tree's .gitignore to
      name each path copy-starter.sh skips (__pycache__/, *.pyc,
      .pytest_cache/, node_modules/, .DS_Store); the lines already present
      are not repeated.

  # ---- Re-pin round 23: the privacy denylist fan-out is opt-in in the kit
  - path: README.md
    old: |2
         creates and edits labels), **Secrets: Read & write** (the `secrets` surface
         stores the fanned-out `PRIVACY_DENYLIST`; see "Secrets fan-out" below),
         **Metadata: Read-only**. No webhook. The
    new: |2
         creates and edits labels), **Metadata: Read-only**, and **Secrets: Read &
         write** only if you declare a `secrets` fan-out ("Secrets fan-out" below).
         No webhook. The
    why: >-
      Re-pin round 23. The kit's fleet.yml declares no `secrets` fan-out and
      bootstrap/create-apps.sh grants the settings Apps no Secrets
      permission, so the README asks for it only when an adopter declares one.
  - path: README.md
    old: |2
         Administration: Read, Actions: Read, Issues: Read, Secrets: Read and
         Metadata: Read,
    new: |2
         Administration: Read, Actions: Read, Issues: Read and Metadata: Read
         (and Secrets: Read if you declare a `secrets` fan-out),
    why: Re-pin round 23. The read-only App's permissions, as the kit's bootstrap creates it.
  - path: README.md
    old: |
      The `secrets` surface copies the fleet's privacy denylist into every repo as
      the Actions secret `PRIVACY_DENYLIST`, because a personal account has no
      organization secrets
    new: |
      The `secrets` surface can copy a privacy denylist into every repo as the
      Actions secret `PRIVACY_DENYLIST`, because a personal account has no
      organization secrets. The adoption kit's `fleet.yml` declares no fan-out,
      and its plan jobs do not ask for Secrets: Read: the kit's bootstrap
      stores that secret directly in each of your repos that reads it
      (`bootstrap/set-secrets.sh --only privacy`). To fan
      it out, add `secrets: [{name: PRIVACY_DENYLIST}]` under `defaults` in
      `fleet.yml`; in `.github/workflows/repo-settings.yml`, add
      `permission-secrets: read` to the three read-only token steps, the
      `PRIVACY_DENYLIST` secret to the two apply steps' `env`, and the
      `PRIVACY_DENYLIST_UPDATED_AT` variable to the workflow's `env`; then
      follow these steps
    why: >-
      Re-pin round 23. The source fans its denylist out to every repo; the
      kit's set-secrets.sh stores it directly in each kit repo that reads it,
      so the fan-out ships off and this says how to turn it on.
  - path: README.md
    old: "   python3 scripts/set_privacy_denylist.py --file ~/.config/privacy-denylist.txt\n"
    new: "   python3 scripts/set_privacy_denylist.py --repo <owner>/repo-settings --file ~/.config/privacy-denylist.txt\n"
    why: Re-pin round 23. The kit's setter has no default repo (the source's names its owner's), so --repo is required.

patches:
  - file: kit_config.py
    why: >-
      C11: fleet.yml declares only the kit's repos. C12: the two App ids it
      grants a bypass are read from variables the bootstrap sets, not
      hardcoded (engine, workflow env and schema.md change with it).
  - file: app_ids.py
    why: >-
      C12: the decision records gave the source's two bypass Apps' numeric
      ids beside the substituted App slugs; they become the placeholders
      <roster App id> and <guidance sync App id>, found from the ADRs at run
      time so the kit spells neither.
  - file: evals_fragment.py
    why: >-
      C13: fleet.yml declares the base repos only. skills-evals' element is
      found by its parsed name (exactly once, or the export fails) and moved,
      line for line, to repo-settings/fleet.evals.yml, which /adopt-evals
      merges; the tests read both files while the fragment exists.

regenerate:
  - copy_from_kit: {repo: _agent-guidance, from: .github/fleet-contributor-rules.md, to: .github/fleet-contributor-rules.md}
    why: >-
      The sync delivers _agent-guidance's contributor rules here byte for
      byte, and that repo's copy is rebuilt from the kit's base.md; the
      source copy holds the owner's sections the kit leaves out (acsi-kit#72).
  - copy_from_kit: {repo: _agent-guidance, from: agents-md/base.md, to: .claude/hooks/fleet-guidance.md}
    why: The sync delivers _agent-guidance's base.md here byte for byte; it carries that repo's X9 blanking.
  - copy_from_kit: {repo: _agent-guidance, from: templates/agent-checks/agent-checks, to: .githooks/agent-checks}
    why: The sync delivers the agent-checks runner from _agent-guidance's templates; X9 ships it with no checks.
  - copy_from_kit: {repo: _agent-guidance, from: templates/agent-checks/dated-phrasing-allowlist.txt, to: .githooks/dated-phrasing-allowlist.txt}
    why: The sync delivers the dated-phrasing allowlist from _agent-guidance's templates; it carries that repo's C11 trim.
  - run: >-
      printf '%s\n%s\n' "$("$EXPORT_TREE_AGENT_GUIDANCE/scripts/build-agents-md.sh")"
      "$(sed -n '/^## Repo-specific additions/,$p' AGENTS.md)" > AGENTS.md.new
      && mv AGENTS.md.new AGENTS.md
    why: The managed half of AGENTS.md is the exported _agent-guidance's build-agents-md.sh output.

# The repo's own suite, as tests.yml runs it.
suite:
  setup: python3 -I -c 'import yaml, markdown_it'
  command: python3 -I -m unittest discover -s tests
  needs: the pins in requirements-dev.txt (python3 -m pip install --ignore-installed PyYAML -r requirements-dev.txt)
