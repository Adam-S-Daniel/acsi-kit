      it, and the sweep test that asserts them (the expected count follows). It
      landed before the source change and is tolerant of its absence.
  - file: blank_content.py
    why: >-
      X9 and Content tiers. base.md keeps the core sections (two of them split
      into a core part under the original heading and a recommended part
      under a new one) and a commented template; each recommended or
      opinionated section goes to library/guidance/<id>/ with its
      eval-coverage row and impact entry; the per-stack sections carry no
      rule; guidance-impact.md and the lessons ledger keep headers only; the
      agent-checks runner ships the core checks (secret-file, skill-shell)
      and a commented example, and rules-dir goes to library/git-hooks/.
  - file: kit_repos.py
