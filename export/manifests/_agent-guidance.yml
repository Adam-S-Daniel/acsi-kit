# P3: generated files rebuilt from the edited sources, in this order.
regenerate:
  - run: NODE_PATH="$EXPORT_SOURCES/_agent-guidance/node_modules" node scripts/check-guidance-coverage.js --write-bytes >/dev/null
    why: Section byte counts in agents-md/eval-coverage.yml follow base.md.
  - run: NODE_PATH="$EXPORT_SOURCES/_agent-guidance/node_modules" node scripts/build-contributor-rules.js --write >/dev/null
    why: >-
      .github/fleet-contributor-rules.md is built from the base.md sections
      eval-coverage.yml marks for contributors; blank_content.py changes both,
      and test-contributor-rules.js checks the committed file is current.
  - run: >-
      printf '%s\n%s\n' "$(./scripts/build-agents-md.sh)"
      "$(sed -n '/^## Repo-specific additions/,$p' AGENTS.md)" > AGENTS.md.new
      && mv AGENTS.md.new AGENTS.md
    why: The managed half of AGENTS.md is build-agents-md.sh output (the recipe in this repo's AGENTS.md).
  - run: >-
      python3 -I -c 'import hashlib,re,pathlib;
      p=pathlib.Path("repos.yml"); h=hashlib.sha256(pathlib.Path(".claude/hooks/skills-bootstrap.sh").read_bytes()).hexdigest();
      t=p.read_text(); n=re.subn(r"(?m)^(  sha256: )[0-9a-f]{64}$", lambda m: m.group(1)+h, t);
      assert n[1]==1, n[1]; p.write_text(n[0])'
    why: >-
      repos.yml pins the vendored hook's sha256 (test_self_hosted_hook_pin);
      substitution changed the hook's bytes. `ref` names a registry commit
      the adopter's registry will not have: REGENERATE.md.
  - run: >-
      python3 -I -c 'import hashlib,re,pathlib;
      h=hashlib.sha256(pathlib.Path(".claude/hooks/fleet-memory.sh").read_bytes()).hexdigest();
      p=pathlib.Path("docs/codex-cloud.md"); t=p.read_text();
      n=re.subn(r"(?m)^(fleet_pin_sha256=)[0-9a-f]{64}$", lambda m: m.group(1)+h, t);
      assert n[1]==1, n[1];
      c=re.subn(r"(?m)^(fleet_pin_commit=)[0-9a-f]{40}$", lambda m: m.group(1)+"0"*40, n[0]);
      assert c[1]==1, c[1]; p.write_text(c[0])'
    why: >-
      Acsi-kit#74. docs/codex-cloud.md pins the sha256 of fleet-memory.sh and
      test_codex_cloud_recipe holds it to the working-tree hook; the kit's hook
      differs from the source's (C2 folds the first owner), so the pin follows
      the kit's copy. The source's pinned commit is not in the adopter's repo,
      so it becomes forty zeros, which fail closed (the edit above says what to
      put there; the test skips a commit not in history).
# P2 citation spans that are really test data: protecting them would leave
