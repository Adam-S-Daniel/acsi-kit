                set -euo pipefail
                d="$RUNNER_TEMP/eval-protected"
                mkdir -p "$d"
                n="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"
                head="$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
                gh api "repos/$GITHUB_REPOSITORY/pulls/$n" > "$d/pr.json"
                gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$n/files?per_page=100" \
                  | jq 'add // []' > "$d/files.json"
                git show "$head:agents-md/base.md" > "$d/base.md"
                if [[ "$EVALS_ON" != true ]]; then
                  # No eval loop, so no eval results: nothing is protected.
                  echo "::notice::not checked: eval protection of guidance sections (EVALS_REPO is none, so there are no eval results to protect)"
                  node scripts/eval-protected.js ci --repo "$GITHUB_REPOSITORY" \
                    --pr-json "$d/pr.json" --files "$d/files.json" --base-md "$d/base.md" \
                    --no-evidence
                  exit 0
                fi
                curl -fsSL --retry 3 -o "$d/explorer.json" \
                  "https://raw.githubusercontent.com/$EVALS_REPO/persistent/eval-results/explorer/latest.json" \
                  || rm -f "$d/explorer.json"
                node scripts/eval-protected.js ci --repo "$GITHUB_REPOSITORY" \
                  --pr-json "$d/pr.json" --files "$d/files.json" --base-md "$d/base.md" \
                  --explorer "$d/explorer.json"
    why: 'kit departure: base-only track; source follow-up proposed. Without skills-evals the explorer can never be fetched, so a pull request that touched a guidance section failed closed; with EVALS_REPO none the gate runs with --no-evidence (nothing is protected) and says so, and otherwise reads the explorer from the repository EVALS_REPO names.'

  # ---- Base-only track, review fix: a worker's fire URL before its step.
  - path: .github/workflows/fleet-worker-fire.yml
    stage: output
    old: |
      #   Unset or empty fails the Loop worker's fire naming it. The pace hold below
      #   reads the repository it names. The Fleet worker ignores it.
    new: |
      #   Unset or empty fails the Loop worker's fire naming it. The pace hold below
      #   reads the repository it names. The Fleet worker ignores it.
      # * A fire URL of `none` means that task is not set up yet: its fire exits 0
      #   with a notice naming the variable and the kit step that sets it, after
      #   the cadence check. bootstrap/create-environments.sh writes `none` only
      #   while the variable is not set at all, and the step that creates the
      #   routine overwrites it. An empty URL (never set, or deleted) still fails.
    why: 'kit departure: base-only track. The Fleet worker leg failed on its slot from the _agent-guidance merge (step 10) until step 27 set its URL (its routine needs step 23 first), and the Loop worker leg could fail the same way between an EVALS_REPO flip and step 41.'
  - path: .github/workflows/fleet-worker-fire.yml
    stage: output
    old: |2
                missing=()
                [[ -n "$FIRE_URL" ]] || missing+=("variable $URL_VAR")
    new: |2
                if [[ "$FIRE_URL" == none ]]; then
                  if [[ "$WORKER" == fleet ]]; then setup_step=27; else setup_step=41; fi
                  echo "::notice::not set up yet: variable $URL_VAR is none, so the $WORKER worker was not fired. Step $setup_step of the kit's quick start creates its routine and sets $URL_VAR and $BEARER_VAR."
                  exit 0
                fi
                missing=()
                [[ -n "$FIRE_URL" ]] || missing+=("variable $URL_VAR")
    why: 'kit departure: base-only track. An explicit none (written by create-environments.sh until the routine exists) skips the fire with a notice; the source has no such value. Empty still fails naming the variable, so a URL deleted after setup stays red.'
  - path: test/test-fleet-worker-fire.js
    stage: output
    old: test('a failed fire fails the run with the status code only', () => {
    new: |-
      test('a fire URL of none is not set up yet for either worker: exit 0, a notice naming the step, nothing fired', () => {
        for (const [role, extra, name, step] of [['fleet', {}, 'FLEET_WORKER_FIRE_URL', 27],
          ['loop', { line: '20 6,18 * * *' }, 'LOOP_WORKER_FIRE_URL', 41]]) {
          for (const bearer of [undefined, '']) {
            const over = { role, url: 'none', ...extra, ...(bearer === undefined ? {} : { bearer }) };
            const { result, curl, git } = runFire(over);
            assert.equal(result.status, 0, JSON.stringify(over) + result.stdout + result.stderr);
            assert.equal(curl.length, 0);
            assert.equal(git.length, 0, 'nothing is cloned');
            assert.ok(result.stdout.includes(`::notice::not set up yet: variable ${name} is none`), result.stdout);
            assert.ok(result.stdout.includes(`Step ${step} of the kit`), result.stdout);
          }
        }
      });

      test('a failed fire fails the run with the status code only', () => {
    why: 'kit departure: base-only track. Covers the none branch for both workers; the empty-URL failure stays covered by the source''s own test.'

