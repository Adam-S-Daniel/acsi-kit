      names only the kit's repos.
  - file: machinery_tests.py
    why: >-
      X9 and Content tiers. The tests that asserted on left-out content move
      to test-only fixtures or, where they only locked it, are removed; the
      secret-file and skill-shell cases are kept, and the rules-dir cases and
      assertions go to its library item, which puts them back on install
