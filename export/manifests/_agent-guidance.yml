# inventory (scratch manifests/_agent-guidance.yml, 2026-10-29) as amended by
# DECISIONS.md: run logs and changelogs are kept (not truncated), the
# platform-only code paths are kept with invented names (C3), and the
# scheduled-run-health reusable is copied in (C4).
repo: _agent-guidance
kit_name: agent-guidance
source: _agent-guidance
source_sha: e2270923ab4444b54e17bedbc703871cb5b59bc1

exclude:
  - path: docs/reference/adopt-the-whole-system.md
    why: A pointer to this kit's own repo (acsi-kit), where the kit moved; an adopter's copy has no use for it.
  - path: docs/evidence/2026-10-07-workstation-retirement-117.md
    why: DECISIONS X7 (a checkpoint on retiring the owner's own workstation; nothing links to it).
  - path: docs/routines/fleet-health-audit.md
    why: >-
      DECISIONS "Re-pin (2026-11-03)". The owner's weekly audit of their own
      fleet: its first run seeds from the owner's hand audit, and it reads the
      task health snapshot that the kit's wsl-automation does not publish.
      Nothing links to it.
  - path: .github/health-audit-platform-ref
    why: C4. The platform release the source fetches the audit scripts at; the kit copies the script into this repo instead.
  - path: .github/workflows/health-reusable-parity.yml
    why: C4. A daily check that the reusable matches the platform's and bump of the pin above; the kit has no platform to compare with.
  - path: scripts/check-health-reusable-parity.js
    why: C4. The parity workflow's script.
  - path: test/test-health-reusable-parity.js
    why: C4. The parity script's tests.

# DECISIONS C4: the audit script the scheduled-run-health reusable runs. The
# source fetches it from the platform repo, which is not in the kit, so it comes
# from that repo at the release the source pins (.github/health-audit-platform-ref)
# and the reusable reads it from this repo instead.
imports:
  - repo: cms-platform
    sha: e0d772c22312cc6585d0b4f70de8bc22d0f18368
    path: scripts/audit-scheduled-runs.js
    why: C4. The reusable's audit step runs this script; the source fetches it from the platform repo, which is not in the kit.

