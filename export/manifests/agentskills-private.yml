# Export of adam-agentskills-private into starter/agent-skills-private/ (repo
# name `acsi-agentskills-private`, DECISIONS C1). Built from the inventory (scratch
# manifests/adam-agentskills-private.yml, 2026-10-29) as amended by
# DECISIONS.md. Only what that inventory lists as include or include_edit is
# copied: everything but the credential runbook (X3) and the one skill (X2).
repo: agentskills-private
kit_name: agent-skills-private
source: adam-agentskills-private
source_sha: f5bda1091249b0d2d68699e6de8106d13c793c7e
# The sync-delivered files come from the exported _agent-guidance, and the
# lock pins the exported public registry.
after: [_agent-guidance, agentskills]

exclude:
  - path: docs/credential-runbook.md
    why: DECISIONS X3 (it names the owner's real credentials and where they live). Never copied.
  - path: plugins/adam-private-anything-anywhere/skills/
    why: DECISIONS X2 and X9 (the owner's writing-style skill, the only skill here; the plugin keeps its manifest).

# Only these source files are copied (DECISIONS, re-pin round 21). The source
# is private, so a file it adds after this pin never ships until a maintainer
# reads it and lists it here; an exclude list alone would let it through.
include:
  - .claude-plugin/marketplace.json
  - .claude/hooks/agent-checks-guard.sh
  - .claude/hooks/skills-bootstrap.sh
  - .claude/settings.json
  - .gitattributes
  - .githooks/agent-checks
  - .githooks/dated-phrasing-allowlist.txt
  - .githooks/dated-phrasing.js
  - .githooks/dated-phrasing/package-lock.json
  - .githooks/dated-phrasing/package.json
  - .githooks/privacy-comment-scan.py
  - .githooks/privacy-denylist.py
  - .github/workflows/actions.lock
  - .github/workflows/agent-checks.yml
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - lessons/README.md
  - lessons/example/proposals/2026-01-06/guidance-security__agent-check.json
  - lessons/example/proposals/2026-01-06/skill-writing-adrs__fixture-candidate.json
  - lessons/example/records/2026-01-06.jsonl
  - plugins/adam-private-anything-anywhere/.claude-plugin/plugin.json
  - setup.sh
  - skills.lock

substitutions:
  # C1, as in the public registry's manifest: a bare `agentskills` names the
  # retired predecessor registry, never the renamed live one
  # (`acsi-agentskills`).
  - name: C1 retired registry (bare)
    regex: '(?<![\w.-])agentskills(-private)?(?![\w.-])'
    to: 'retired-agentskills\1'

edits:
  - path: .claude-plugin/marketplace.json
    stage: output
    old: |
      "owner": { "name": "the owner" },
        "description": "the owner's personal agent skills — content that is simply personal. Public counterpart: example-adopter/acsi-agentskills.",
    new: |
      "owner": { "name": "<your name>" },
        "description": "Private agent skills: content that is personal or sensitive. Public counterpart: example-adopter/acsi-agentskills.",
    why: >-
      C10 and X9. Names the owner with the kit's `<your name>` placeholder
      (copy-starter.sh fills it from OWNER_NAME) and describes the registry,
      not the owner.
  - path: .claude-plugin/marketplace.json
    stage: output
    old: '"description": "the owner''s personal skills that run anywhere: claude.ai (web, iOS, Chrome, Desktop) and Claude Code. In Claude Code it also records, once per session, whether the full fleet guidance loaded.",'
    new: '"description": "Private skills that run anywhere: claude.ai (web, iOS, Chrome, Desktop) and Claude Code.",'
    why: >-
      C10. Describes the bundle, not the owner, and without the guidance-load
      record the kit leaves out (DECISIONS "Re-pin of the private registry,
      2026-11-26").
  - path: plugins/acsi-private-anything-anywhere/.claude-plugin/plugin.json
    stage: output
    old: |
      "description": "the owner's personal skills that run anywhere: claude.ai (web, iOS, Chrome, Desktop) and Claude Code. In Claude Code it also records, once per session, whether the full fleet guidance loaded.",
        "author": { "name": "the owner" },
        "hooks": "./hooks/claude-code.json"
    new: |
      "description": "Private skills that run anywhere: claude.ai (web, iOS, Chrome, Desktop) and Claude Code.",
        "author": { "name": "<your name>" }
    why: >-
      The same description as the marketplace entry, the `<your name>`
      placeholder, and no `hooks` key: the bundle's two Stop hooks send the
      source owner's usage records to the source owner's usage sink, so the
      kit leaves hooks/ out (DECISIONS "Re-pin of the private registry,
      2026-11-26").

  - path: .github/workflows/agent-checks.yml
    stage: output
    old: |2
              env:
                PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
                BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    new: |2
              env:
                BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    why: >-
      kit departure: no script stores PRIVACY_DENYLIST in this repo
      (set-secrets.sh's OTHER_VALUES), and bootstrap/tests/check-refs.py
      fails on a secret a workflow reads that nothing sets. Without the
      secret the runner skips the scan with a warning, as before this re-pin.
      Storing it here is a later bootstrap change (DECISIONS "Re-pin of the
      private registry, 2026-11-26").
# overlay/agentskills-private/ adds NOTICE and .gitignore (the source has
# no .gitignore; the kit's bootstrap test wants every starter tree to ignore
# what copy-starter.sh skips).

patches:
  - file: owner_only.py
    why: >-
      DECISIONS "Re-pin of the private registry (2026-11-26)". The source's
      agent-checks.yml runs an eval-protection gate against the owner's
      _agent-guidance and skills-evals commits, its actions.lock lists the
      owner's left-out workflows, and its AGENTS.md and README.md describe the
      usage sink and the private explorer; this cuts each, checking its shape.

regenerate:
  - copy_from_kit: {repo: _agent-guidance, from: .github/fleet-contributor-rules.md, to: .github/fleet-contributor-rules.md}
    why: >-
      The sync delivers _agent-guidance's contributor rules here byte for
      byte, and that repo's copy is rebuilt from the kit's base.md; the
      source copy holds the owner's sections the kit leaves out (acsi-kit#72).
  - copy_from_kit: {repo: _agent-guidance, from: templates/agent-checks/agent-checks, to: .githooks/agent-checks}
    why: The sync delivers the agent-checks runner from _agent-guidance's templates; X9 ships it with no checks.
  - copy_from_kit: {repo: _agent-guidance, from: templates/agent-checks/dated-phrasing-allowlist.txt, to: .githooks/dated-phrasing-allowlist.txt}
    why: The sync delivers the dated-phrasing allowlist from _agent-guidance's templates; it carries that repo's C11 trim.
  - copy_from_kit: {repo: _agent-guidance, from: templates/agent-checks/agent-checks-guard.sh, to: .claude/hooks/agent-checks-guard.sh}
    why: The sync delivers the guard (byte-identical in the sources).
  - copy_from_kit: {repo: _agent-guidance, from: .claude/hooks/skills-bootstrap.sh, to: .claude/hooks/skills-bootstrap.sh}
    why: Byte-identical in the sources; _agent-guidance's repos.yml pins its sha256.
  - copy_from_kit: {repo: agentskills, from: skills.lock, to: skills.lock}
    why: >-
      P3. This lock pins the public registry's cloud-safe bundles, exactly
      what the public registry's own regenerated lock says (no skills, X9;
      the ref is the adopter's first public commit, REGENERATE.md).
  - run: >-
      printf '%s\n%s\n' "$("$EXPORT_TREE_AGENT_GUIDANCE/scripts/build-agents-md.sh")"
      "$(sed -n '/^## Repo-specific additions/,$p' AGENTS.md)" > AGENTS.md.new
      && mv AGENTS.md.new AGENTS.md
    why: The managed half of AGENTS.md is the exported _agent-guidance's build-agents-md.sh output.

# The repo has no test suite; its one CI job (agent-checks.yml) runs the
# agent-checks runner over the change. This runs it the same way over the
# starter's one commit and its whole tree, then setup.sh with a scratch HOME,
# which must succeed while the bundle has no skills.
suite:
  git_init: true
  command: >-
    bash .githooks/agent-checks ci "" HEAD
    && bash .githooks/agent-checks tree HEAD
    && h=$(mktemp -d) && HOME="$h" bash setup.sh && rm -rf "$h"
    && echo "OK: agent-checks ci and tree, and setup.sh with no skills"
  needs: bash, git
  summary: '^(OK: .*|No private skills found.*)$'
