# Which starter files each hand-written page under docs/ describes.
#
# export/doc_review.py reads this after a re-sync and lists, in the pull
# request, every page whose sources changed, so a reviewer knows which pages
# the new pins may have made stale. Keep each list to the sources that would
# make the page wrong if they changed, not whole trees. `**` crosses
# directories; `*` does not cross `/`.
#
# required: false means a routine spec or scheduled workflow that no page
# names is only a warning in export/tests/test_doc_review.py; true makes it a
# failure. Flip it once `not_documented` is settled.
required: false

