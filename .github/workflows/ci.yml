# The kit's own checks: its tests (the leak scan over every kit file, public
# names and the owner's private denylist; every kit file tracked by git; the
# suite runner), the bootstrap tests, and `export.py --check` (each starter
# tree equals a fresh export of its pinned source, as git tracks it).
#
# `test` is the required check, so there is no `on.paths` (a skipped required
# check blocks the merge). Every file in this repo is kit content, so there is
# no salient-path gate either: every pull request and push runs it all.
name: CI
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event_name == 'push' && format('push — {0}', github.ref_name) || format('dispatch — {0}', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # The denylist arrives through `env:` from the repository secret and is
      # read by the test from the environment; it is never interpolated into
      # the script, and the test prints a hit as `path:line: pattern #N`,
      # never the text. A missing or empty secret FAILS this step: a leak scan
      # that checked nothing must not read as green. The one exception is a
      # pull request from `dependabot[bot]` (read from $GITHUB_EVENT_PATH),
      # which GitHub runs without secrets and which cannot add personal data:
      # it warns, and the public scan and `--check` still run (CI=false makes
      # the private half skip, as it does locally). A fork's pull request also
      # gets no secret, so it fails here by design; the owner brings its change
      # in on a branch of this repo instead.
      #
      # The sources are fetched at the manifests' pinned commits with no
      # credential, so the private registry's tree (its source is private) is
      # left out of `--check` (`--skip`); its files are still scanned, and
      # checked as tracked, by the tests. The full check runs in
      # run-all-tests.sh on a machine with every source checked out.
      - name: Kit tests and export check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          SOURCE_OWNER: ${{ github.repository_owner }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ -z "${PRIVACY_DENYLIST//[[:space:]]/}" ]; then
            author=$(jq -r '.pull_request.user.login // empty' "${GITHUB_EVENT_PATH:-/dev/null}" 2>/dev/null) || author=""
            if [ "$author" = "dependabot[bot]" ]; then
              echo "::warning::the PRIVACY_DENYLIST secret is not available to a Dependabot run, so the kit's private leak scan was skipped; the public scan and the export check still ran"
            else
              echo "::error::the PRIVACY_DENYLIST repository secret is unset or empty (a fork's pull request never gets it), so the kit's leak scan cannot run: set the secret (one regular expression per line), then re-run"
              exit 1
            fi
            export CI=false
          fi
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3 markdown-it-py==4.2.0
          python3 -m pytest export/tests -q -p no:cacheprovider
          python3 export/fetch_sources.py --owner "$SOURCE_OWNER" --dest "$RUNNER_TEMP/kit-sources" --skip agentskills-private
          # Two exports run a source's own Node code (their manifests'
          # regenerate steps), and a fetched source has no work tree: the
          # _agent-guidance export runs that repo's scripts with NODE_PATH at
          # its node_modules, and the skills-evals export builds its three
          # explorer pages with esbuild from explorer/node_modules. Install
          # each from its own lockfile at the manifest's pinned commit.
          npm_at_pin() {  # npm_at_pin <manifest> <source checkout> <folder in it, or "" for its root>
            local sha npm_dir pre=${3:+$3/}
            sha=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["source_sha"])' "$1")
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$1 has no full source_sha"; exit 1; }
            npm_dir=$(mktemp -d "$RUNNER_TEMP/npm-XXXXXX")
            git -C "$2" show "$sha:${pre}package.json" > "$npm_dir/package.json"
            git -C "$2" show "$sha:${pre}package-lock.json" > "$npm_dir/package-lock.json"
            npm ci --prefix "$npm_dir" --ignore-scripts --no-audit --no-fund --silent
            mkdir -p "$2/$pre"
            mv "$npm_dir/node_modules" "$2/${pre}node_modules"
          }
          npm_at_pin export/manifests/_agent-guidance.yml "$RUNNER_TEMP/kit-sources"/_agent-guidance ""
          npm_at_pin export/manifests/skills-evals.yml "$RUNNER_TEMP/kit-sources"/skills-evals explorer
          python3 export/export.py --check --sources "$RUNNER_TEMP/kit-sources" --skip agentskills-private

      - name: Bootstrap tests
        run: bash bootstrap/tests/test-bootstrap.sh

  # Every export's own test suite (starter/run-all-tests.sh), the gap that let
  # about 250 skills-evals export defects through (issue #72). A required
  # check, so: no `on.paths`, no matrix and no `concurrency` group. The first
  # step decides whether this pull request or push changed `starter/`,
  # `export/`, this workflow or the action lockfile its steps run from; every
  # later step is gated on it, so an
  # unrelated change still reports success.
  starter-suites:
    name: starter-suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The whole history, so both ends of the diff below are present
          # whatever the base branch is.
          fetch-depth: 0

      # The event's shas are read from $GITHUB_EVENT_PATH, never interpolated
      # into the script. A dispatch, a new branch's first push or a base that
      # cannot be found runs the suites rather than skipping them.
      - name: Detect starter or export changes
        id: scope
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
                          head=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH") ;;
            push)         base=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
                          head=$(jq -r '.after // empty' "$GITHUB_EVENT_PATH") ;;
            *)            base="" head="" ;;
          esac
          run=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] \
             && git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base...$head")
            if ! grep -qE '^(starter/|export/|\.github/workflows/(ci\.yml|actions\.lock)$)' <<<"$changed"; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "starter/, export/, ci.yml or actions.lock changed (or the diff could not be computed): running the starter suites"
          else
            echo "::notice::No change under starter/, export/, ci.yml or actions.lock: skipping the starter suites; this step's success keeps the required starter-suites check present."
          fi

      # 3.12, the version the exported repos' own CI installs (skills-evals'
      # test_issue_88 depends on it).
      - uses: actions/setup-python@v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22

      # mikefarah's Go yq v4, which _agent-guidance's scripts/sync.sh needs
      # (Ubuntu's `yq` is a different program). The version and digest are
      # the ones _agent-guidance's own ci.yml pins; the digest is
      # `yq_linux_amd64`'s from that release's `checksums` file.
      - name: Install yq
        if: steps.scope.outputs.run == 'true'
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/yq" "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64"
          printf '%s  %s\n' "$YQ_SHA256" "$tmp/yq" | sha256sum -c -
          sudo install -m 0755 "$tmp/yq" /usr/local/bin/yq
          yq --version

      # bubblewrap for skills-evals' workspace-executing scorers (they fail
      # closed without it), and jq for several suites.
      - name: Install bubblewrap and jq
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap jq

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # so neither `unshare --user` (the PID namespace the suites run in) nor
      # bwrap inside it can start. Lift the restriction on this throwaway
      # runner only when the probe shows it is in force.
      - name: Allow unprivileged user namespaces
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! unshare --user --map-current-user --pid --fork --mount-proc -- true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-current-user --pid --fork --mount-proc -- \
            bwrap --ro-bind / / --unshare-pid --unshare-net --proc /proc --dev /dev --die-with-parent -- true

      # The Python pins agent-skills' and repo-settings' suites check for
      # (their manifests' `needs`); skills-evals' setup installs its own.
      # skills-evals' real-work fixture gems need the bundler version their
      # lockfile names, as skills-evals' own ci.yml installs it.
      - name: Install suite dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --ignore-installed PyYAML -r starter/agent-skills/requirements-dev.txt
          python3 -m pip install --quiet --ignore-installed PyYAML -r starter/repo-settings/requirements-dev.txt
          sudo gem install bundler --version 4.0.10 --no-document

      - name: Run the starter suites
        if: steps.scope.outputs.run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -uo pipefail
          unshare --user --map-current-user --pid --fork --mount-proc -- bash starter/run-all-tests.sh
          rc=$?
          echo "run-all-tests.sh exited $rc"
          exit "$rc"
