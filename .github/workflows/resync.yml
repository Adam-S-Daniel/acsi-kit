# Keeps the kit in step with its source repos (issue #2): moves every
# manifest's pinned commit to its source's current head, regenerates starter/,
# runs the export's tests, and opens or updates one pull request from
# `resync/auto`. If one source's new head breaks the export or its tests, that
# source is held back at its old pin (export/resync_holdback.py) and the others
# still move; see the held-back issue below. A human still reviews and merges
# the pull request: new skills or guidance sections need tiering, and
# departures need recording in DECISIONS.md.
#
# The private registry (agentskills-private) is left out: its source cannot be
# read without a credential, so it is re-pinned by hand (MAINTAINING.md).
#
# Not a pull request or push workflow, so no salient-path filter and no
# required check. Opening the pull request needs a GitHub App (variable
# RESYNC_APP_CLIENT_ID, secret RESYNC_APP_PEM) with contents and pull-requests
# write on this repo; without one the job reports what it would change and
# succeeds. The App's token, unlike GITHUB_TOKEN, lets the pull request's own
# checks run.
#
# A scheduled failure is otherwise silent, so a failed run opens or updates ONE
# open issue, "Re-sync from sources is failing", with the run's link and the
# failed step's name (never its log), and the next successful run closes it. A
# run that held a source back opens or updates the same issue, naming the held
# sources and the run (never a log), without failing the job; only a run with
# nothing held back closes it. If every source is held back there is no pull
# request.
# When a later run finds every source already at its pin, it closes a stale
# open `resync/auto` pull request, since main already has everything.
# Those steps use GITHUB_TOKEN, which is why the job alone holds
# issues: write. A held-back source also fires the fix routine
# (export/FIX-ROUTINE.md), at most once a day, which pushes a `resync-fix/`
# branch that follows it; resync-fix-pr.yml opens the pull request, because the
# routine can push but cannot open pull requests or comment (a second workflow,
# resync-fix-pushed.yml, only triggers that one).
name: Re-sync from sources

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once (a dispatch beside the schedule) would both pass the fix
# routine's once-a-day check, so runs queue; a queued run is never cancelled.
# Not a pull request workflow, so this is no required check.
concurrency:
  group: resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow's, so contents: read is repeated;
    # issues: write is for the issue steps, and pull-requests: read lets the
    # fire step see an open fix pull request.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Move the pins to each source's head
        id: resync
        env:
          SOURCE_OWNER: ${{ github.repository_owner }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          summary="$RUNNER_TEMP/resync-summary.md"
          python3 export/resync.py --owner "$SOURCE_OWNER" --summary "$summary"
          if git diff --quiet; then
            echo "Every source is at its pinned commit: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A leak scan that checked nothing must not read as green, so a missing
      # or empty denylist fails here, as in ci.yml (this job never runs for
      # Dependabot, so ci.yml's exception does not apply).
      #
      # The same fetch and npm install as ci.yml's test job, but with the old
      # pins fetched too: export/resync_holdback.py regenerates starter/ and
      # runs export/tests, and when the new pins break either it holds the
      # broken source back at its old pin so the others still move. It exits 0
      # even if every source is held back, and reports through its outputs.
      - name: Regenerate starter/, holding back a source that breaks it
        id: holdback
        if: steps.resync.outputs.changed == 'true'
        env:
          SOURCE_OWNER: ${{ github.repository_owner }}
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ -z "${PRIVACY_DENYLIST//[[:space:]]/}" ]; then
            echo "::error::the PRIVACY_DENYLIST repository secret is unset or empty, so the kit's leak scan cannot run: set the secret (one regular expression per line), then re-run"
            exit 1
          fi
          sources="$RUNNER_TEMP/kit-sources"
          python3 export/fetch_sources.py --owner "$SOURCE_OWNER" --dest "$sources" --skip agentskills-private --also-pins-at HEAD
          # The failing output's tails go to a file for a fixer to read; they
          # are never printed here or copied into the pull request or issue.
          python3 export/resync_holdback.py --owner "$SOURCE_OWNER" --sources "$sources" \
            --summary "$RUNNER_TEMP/resync-summary.md" --tails "$RUNNER_TEMP/holdback-tails.txt"
          echo "files changed: $(git status --porcelain | wc -l)"

      - name: Show the summary
        if: steps.resync.outputs.changed == 'true'
        run: cat "$RUNNER_TEMP/resync-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for the App
        id: app
        # The holdback step is skipped when nothing changed, so its output is
        # empty then and the App is still wanted, to close a stale pull request.
        if: steps.holdback.outputs.all_held != 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RESYNC_APP_CLIENT_ID }}
          HAS_PEM: ${{ secrets.RESYNC_APP_PEM != '' }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID" ] && [ "$HAS_PEM" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            printf '\nno App configured; nothing opened\n' >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App token
        id: token
        if: steps.app.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RESYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RESYNC_APP_PEM }}
          # Only what pushing the branch and opening the pull request need.
          permission-contents: write
          permission-pull-requests: write

      - name: Push resync/auto and open or update the pull request
        id: push
        if: steps.app.outputs.configured == 'true' && steps.resync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch=resync/auto
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot}" --jq .id) || bot_id=""
          [[ "$bot_id" =~ ^[0-9]+$ ]] || { echo "::error::could not read the App's bot user id"; exit 1; }
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add -A -- export/manifests starter
          git commit -q -m "Re-sync the kit from its source repos" \
            -m "Moves each manifest's source_sha to its source's default-branch head and regenerates starter/ (export/resync.py), except any source the run held back (export/resync_holdback.py)."
          echo "commit: $(git rev-parse HEAD)"
          # The job owns this branch, so it may overwrite it, but only from the
          # commit it saw: a lease on the remote's current sha (empty when the
          # branch does not exist yet) refuses to clobber anything newer.
          remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push -q --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/pr-body.md"
          {
            cat <<'EOF'
          ## TLDR

          Moves the kit's pinned source commits to each source repo's current head and regenerates `starter/` from them. A source listed under "Held back" below stays at its old pin, whatever the table says. Review the changes before merging.

          EOF
            cat "$RUNNER_TEMP/resync-summary.md"
            cat <<'EOF'

          A new skill or guidance section needs a tier in `bootstrap/content-catalog.json`, and any departure from a source needs a record in `export/DECISIONS.md`, before this merges. The private registry (`agentskills-private`) is not re-pinned here; see `MAINTAINING.md`.
          EOF
          } > "$body"
          title="Re-sync the kit from its source repos"
          number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$body" > /dev/null
            echo "updated pull request #$number"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file "$body" > /dev/null
            number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
            echo "opened pull request #$number"
          fi
          gh pr edit "$number" --add-label agent-authored > /dev/null || echo "::warning::could not add the agent-authored label"

      # Every source is already at its pin, so a `resync/auto` pull request
      # left open by an earlier run has nothing left to move: close it.
      # Not best effort: a failed list fails the step and so the run.
      - name: Close a stale re-sync pull request
        id: closestale
        if: steps.app.outputs.configured == 'true' && steps.resync.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          branch=resync/auto
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --base "$BASE_BRANCH" \
            --json number,headRefName,isCrossRepository \
            --jq "[.[] | select((.isCrossRepository | not) and .headRefName == \"$branch\")] | .[0].number // empty") \
            || { echo "::error::could not list open pull requests"; exit 1; }
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every source is already at its pinned commit on $BASE_BRANCH, so this re-sync pull request has nothing left to move. Closed by the daily re-sync.

          <sub>🤖 Written by the daily re-sync on behalf of @$OWNER</sub>" > /dev/null
            echo "closed stale pull request #$number"
          fi

      # A held-back source is not a failed run: the others moved and the pull
      # request is open. It is still a source the kit cannot follow, so it
      # opens or updates the same issue as a failure, naming the sources and
      # the run, never a log. HELD_BACK holds only manifest repo names the
      # script validated.
      - name: Open or update the held-back issue
        id: heldissue
        if: success() && steps.holdback.outputs.held_back != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Re-sync from sources is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HELD_BACK: ${{ steps.holdback.outputs.held_back }}
          ALL_HELD: ${{ steps.holdback.outputs.all_held }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/resync-issue.md"
          {
            printf '## TLDR\n\n'
            printf 'The daily re-sync of the kit held back a source whose new head breaks the export or its tests, so `starter/` is not following it: %s.\n\n' "$HELD_BACK"
            if [ "$ALL_HELD" = true ]; then
              printf 'Every moved source was held back, so no pull request was opened.\n\n'
            else
              printf 'The other sources moved, in the re-sync pull request if the App opened one (see the run).\n\n'
            fi
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'The run summary has a "Held back" section with the old and new pins. A held source needs an `edits` entry or a patch in `export/manifests/` to follow its change, recorded in `export/DECISIONS.md` (MAINTAINING.md, Re-pin); the fix routine or a maintainer must do that. The failing output is kept out of this public issue and the run log: the fix routine receives it, and a maintainer reproduces it by running the export locally. The next run with nothing held back closes this issue.\n'
          } > "$body"
          # A failed list must not open a duplicate, so it stops here.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty') \
            || { echo "::error::could not list open issues; no issue opened or updated"; exit 1; }
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" > /dev/null
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Still held back: $HELD_BACK. $RUN_URL" > /dev/null
            echo "updated issue #$number"
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body")
            number="${url##*/}"
            echo "opened issue #$number"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label agent-authored > /dev/null \
            || echo "::warning::could not add the agent-authored label"

      # Starts the re-sync fix routine (export/FIX-ROUTINE.md), a Claude cloud
      # routine that follows a held source and pushes a `resync-fix/` branch
      # (resync-fix-pr.yml opens the pull request). It fires at most once a UTC
      # day (a marker comment on the issue) and never while such a pull request
      # is open.
      # * The routine's fire URL is a repository variable and its bearer an
      #   Actions secret, with no default: a missing one fails the step naming
      #   it.
      # * The request carries the held sources, the run summary and the
      #   failing output's tails, which only the routine reads. Neither the
      #   request nor the response is printed; the bearer reaches curl on
      #   stdin (--config -), never argv.
      - name: Fire the fix routine
        id: fire
        if: success() && steps.holdback.outputs.held_back != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FIRE_URL: ${{ vars.RESYNC_FIXER_FIRE_URL }}
          FIRE_BEARER: ${{ secrets.RESYNC_FIXER_FIRE_BEARER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ steps.heldissue.outputs.number }}
          HELD_BACK: ${{ steps.holdback.outputs.held_back }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$FIRE_URL" ]] || missing+=("variable RESYNC_FIXER_FIRE_URL")
          [[ -n "$FIRE_BEARER" ]] || missing+=("secret RESYNC_FIXER_FIRE_BEARER")
          if (( ${#missing[@]} )); then
            echo "::error::not configured: ${missing[*]}. Set them in this repository's Actions settings; the fix routine's API trigger on claude.ai gives both (MAINTAINING.md, Re-pin)."
            exit 1
          fi
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::the held-back issue step gave no issue number"; exit 1; }
          # Only this repository's own branches and the job's own comments
          # count: a fork's pull request or anyone's comment must not stop it.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("resync-fix/")))] | length') \
            || { echo "::error::could not list open pull requests; not firing"; exit 1; }
          if [ "$open" != 0 ]; then
            echo "::notice::a resync-fix pull request is already open; not firing"
            exit 0
          fi
          marker="<!-- resync-fixer-fired $(date -u +%F) -->"
          seen=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body') \
            || { echo "::error::could not read the issue's comments; not firing"; exit 1; }
          if grep -qF -- "$marker" <<<"$seen"; then
            echo "::notice::the fix routine already started today; not firing"
            exit 0
          fi
          tails="$RUNNER_TEMP/holdback-tails.txt"
          [ -f "$tails" ] || : > "$tails"
          request="$RUNNER_TEMP/fire-request.json"
          jq -n --arg owner "$OWNER" --arg held "$HELD_BACK" --arg run "$RUN_URL" --arg issue "$ISSUE_NUMBER" \
            --rawfile summary "$RUNNER_TEMP/resync-summary.md" --rawfile tails "$tails" \
            '{text: ("Owner: " + $owner + "\nHeld back: " + $held + "\nRun: " + $run + "\nIssue: #" + $issue
              + "\n\nRun summary:\n" + $summary
              + "\n\nFailing output (the tail of each held source):\n" + ($tails | .[0:12000]))}' > "$request"
          response=$(mktemp)
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$FIRE_BEARER" |
            curl -sS --config - -o "$response" -w '%{http_code}' -X POST "$FIRE_URL" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              --data-binary "@$request") || code="curl-error"
          rm -f "$response" "$request"
          if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::fire failed (HTTP $code)"
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Started the fix routine for: $HELD_BACK. It pushes a \`resync-fix/\` branch, and resync-fix-pr.yml opens the pull request. $marker" > /dev/null \
            || echo "::warning::fired, but could not leave the day's marker comment"
          echo "::notice::fix routine fired"

      # Everything arrives through env:, and the only expressions are the
      # run's own coordinates and step outcomes, so nothing a source or a step
      # printed is evaluated as shell. The body names the failed step and links
      # the run; it never copies a log, which could hold a source's text.
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Re-sync from sources is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME_RESYNC: ${{ steps.resync.outcome }}
          OUTCOME_TOKEN: ${{ steps.token.outcome }}
          OUTCOME_HOLDBACK: ${{ steps.holdback.outcome }}
          OUTCOME_PUSH: ${{ steps.push.outcome }}
          OUTCOME_CLOSESTALE: ${{ steps.closestale.outcome }}
          OUTCOME_FIRE: ${{ steps.fire.outcome }}
        run: |
          set -euo pipefail
          failed=""
          [ "$OUTCOME_RESYNC" = failure ] && failed="${failed}${failed:+, }Move the pins to each source's head"
          [ "$OUTCOME_HOLDBACK" = failure ] && failed="${failed}${failed:+, }Regenerate starter/, holding back a source that breaks it"
          [ "$OUTCOME_TOKEN" = failure ] && failed="${failed}${failed:+, }Mint the App token"
          [ "$OUTCOME_PUSH" = failure ] && failed="${failed}${failed:+, }Push resync/auto and open or update the pull request"
          [ "$OUTCOME_CLOSESTALE" = failure ] && failed="${failed}${failed:+, }Close a stale re-sync pull request"
          [ "$OUTCOME_FIRE" = failure ] && failed="${failed}${failed:+, }Fire the fix routine"
          [ -n "$failed" ] || failed="another step (see the run)"
          body="$RUNNER_TEMP/resync-issue.md"
          {
            printf '## TLDR\n\n'
            printf 'The daily re-sync of the kit from its source repos failed, so `starter/` is not following its sources. Failed step: %s.\n\n' "$failed"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'Read the failed step in the run log. A source change usually means an `edits` entry or a patch in `export/manifests/` needs to follow it; record the change in `export/DECISIONS.md` (MAINTAINING.md, Re-pin). The next successful run closes this issue.\n'
          } > "$body"
          # A failed list must not open a duplicate, so it stops here.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty') \
            || { echo "::error::could not list open issues; no issue opened or updated"; exit 1; }
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" > /dev/null
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again: $RUN_URL (step: $failed)." > /dev/null
            echo "updated issue #$number"
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body")
            number="${url##*/}"
            echo "opened issue #$number"
          fi
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label agent-authored > /dev/null \
            || echo "::warning::could not add the agent-authored label"

      # A green run with nothing held back closes the failure issue, if one is
      # open. It never fails the job: the re-sync itself succeeded.
      - name: Close the failure issue
        if: success() && steps.holdback.outputs.held_back == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Re-sync from sources is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty') \
            || { echo "::warning::could not list open issues; the failure issue, if any, stays open"; exit 0; }
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "The re-sync succeeded again: $RUN_URL" > /dev/null \
              || { echo "::warning::could not close issue #$number"; exit 0; }
            echo "closed issue #$number"
          fi
