# Keeps the kit in step with its source repos (issue #2): moves every
# manifest's pinned commit to its source's current head, regenerates starter/,
# runs the export's tests, and opens or updates one pull request from
# `resync/auto`. A human still reviews and merges it: new skills or guidance
# sections need tiering, and departures need recording in DECISIONS.md.
#
# The private registry (agentskills-private) is left out: its source cannot be
# read without a credential, so it is re-pinned by hand (MAINTAINING.md).
#
# Not a pull request or push workflow, so no salient-path filter and no
# required check. Opening the pull request needs a GitHub App (variable
# RESYNC_APP_CLIENT_ID, secret RESYNC_APP_PEM) with contents and pull-requests
# write on this repo; without one the job reports what it would change and
# succeeds. The App's token, unlike GITHUB_TOKEN, lets the pull request's own
# checks run.
name: Re-sync from sources

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Move the pins to each source's head
        id: resync
        env:
          SOURCE_OWNER: ${{ github.repository_owner }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          summary="$RUNNER_TEMP/resync-summary.md"
          python3 export/resync.py --owner "$SOURCE_OWNER" --summary "$summary"
          if git diff --quiet; then
            echo "Every source is at its pinned commit: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The same fetch and npm install as ci.yml's test job: the _agent-guidance
      # export runs that repo's Node scripts, and a fetched source has no work
      # tree. No `--check` here: this rewrites starter/ from the new pins.
      - name: Regenerate starter/
        if: steps.resync.outputs.changed == 'true'
        env:
          SOURCE_OWNER: ${{ github.repository_owner }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/kit-sources"
          python3 export/fetch_sources.py --owner "$SOURCE_OWNER" --dest "$sources" --skip agentskills-private
          ag="$sources/_agent-guidance"
          ag_sha=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["source_sha"])' export/manifests/_agent-guidance.yml)
          [[ "$ag_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::_agent-guidance manifest has no full source_sha"; exit 1; }
          npm_dir="$RUNNER_TEMP/agent-guidance-npm"
          mkdir -p "$npm_dir"
          git -C "$ag" show "$ag_sha:package.json" > "$npm_dir/package.json"
          git -C "$ag" show "$ag_sha:package-lock.json" > "$npm_dir/package-lock.json"
          npm ci --prefix "$npm_dir" --ignore-scripts --no-audit --no-fund --silent
          mv "$npm_dir/node_modules" "$ag/node_modules"
          python3 export/export.py --sources "$sources" --skip agentskills-private
          # Stage new starter files now: export/tests checks every kit file is
          # tracked by git, and a file a source just added is not yet.
          git add -A -- export/manifests starter
          echo "files changed: $(git status --porcelain | wc -l)"

      # A leak scan that checked nothing must not read as green, so a missing
      # or empty denylist fails here, as in ci.yml (this job never runs for
      # Dependabot, so ci.yml's exception does not apply).
      - name: Export tests
        if: steps.resync.outputs.changed == 'true'
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ -z "${PRIVACY_DENYLIST//[[:space:]]/}" ]; then
            echo "::error::the PRIVACY_DENYLIST repository secret is unset or empty, so the kit's leak scan cannot run: set the secret (one regular expression per line), then re-run"
            exit 1
          fi
          python3 -m pytest export/tests -q -p no:cacheprovider

      - name: Check for the App
        id: app
        if: steps.resync.outputs.changed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RESYNC_APP_CLIENT_ID }}
          HAS_PEM: ${{ secrets.RESYNC_APP_PEM != '' }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/resync-summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_CLIENT_ID" ] && [ "$HAS_PEM" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            printf '\nno App configured; nothing opened\n' >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App token
        id: token
        if: steps.app.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RESYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RESYNC_APP_PEM }}
          # Only what pushing the branch and opening the pull request need.
          permission-contents: write
          permission-pull-requests: write

      - name: Push resync/auto and open or update the pull request
        if: steps.app.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch=resync/auto
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot}" --jq .id) || bot_id=""
          [[ "$bot_id" =~ ^[0-9]+$ ]] || { echo "::error::could not read the App's bot user id"; exit 1; }
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add -A -- export/manifests starter
          git commit -q -m "Re-sync the kit from its source repos" \
            -m "Moves each manifest's source_sha to its source's default-branch head and regenerates starter/ (export/resync.py)."
          echo "commit: $(git rev-parse HEAD)"
          # The job owns this branch, so it may overwrite it, but only from the
          # commit it saw: a lease on the remote's current sha (empty when the
          # branch does not exist yet) refuses to clobber anything newer.
          remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push -q --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/pr-body.md"
          {
            cat <<'EOF'
          ## TLDR

          Moves the kit's pinned source commits to each source repo's current head and regenerates `starter/` from them. Review the changes before merging.

          EOF
            cat "$RUNNER_TEMP/resync-summary.md"
            cat <<'EOF'

          A new skill or guidance section needs a tier in `bootstrap/content-catalog.json`, and any departure from a source needs a record in `export/DECISIONS.md`, before this merges. The private registry (`agentskills-private`) is not re-pinned here; see `MAINTAINING.md`.
          EOF
          } > "$body"
          title="Re-sync the kit from its source repos"
          number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$body" > /dev/null
            echo "updated pull request #$number"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file "$body" > /dev/null
            number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
            echo "opened pull request #$number"
          fi
          gh pr edit "$number" --add-label agent-authored > /dev/null || echo "::warning::could not add the agent-authored label"
