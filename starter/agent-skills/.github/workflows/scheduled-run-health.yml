name: Scheduled-run health audit
# Daily scan of THIS repo's last 48h of scheduled (`event=schedule`) workflow
# runs for failure / startup_failure / timed_out. Scheduled failures are
# otherwise SILENT — no PR goes red, nothing notifies (a consumer's daily
# sweep once startup-failed 30/30 for a month unnoticed). _agent-guidance's
# scheduled-run-health-reusable.yml owns the audit logic; this thin caller
# schedules it. Findings land on a single
# `ci`-labelled tracking issue (opened on first failure, new runs commented,
# auto-closed after a clean window) — the issue notification is the alert.
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
     || format('manual — @{0}', github.actor) }}

on:
  # The schedule starts with the pin: bootstrap/regenerate.sh run-health-sha
  # replaces the forty-zero sha below and turns the next line into the daily
  # schedule (47 8 * * *, an off-peak minute; GitHub's cron lag is absorbed
  # by the reusable's 48h scan window). A schedule at the placeholder would
  # fail at "Set up job" every day until then.
  # schedule-starts-with-the-pin: - cron: '47 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report findings without opening/updating/closing the tracking issue'
        # Not `boolean`: workflow_dispatch hands typed (boolean) inputs to a
        # reusable's `with:` as strings, and the reusable's boolean input
        # rejects them, so the dispatch run startup-fails before any job. A
        # `choice` still arrives as a string, but only 'false' or 'true', and
        # the comparison below turns it into a real boolean. Free text plus
        # fromJSON failed the run on any non-JSON value (`yes`, `True`).
        type: choice
        options: ['false', 'true']
        default: 'false'

# The reusable needs actions: read (list workflow runs) + issues: write
# (open/comment/close the tracking issue); reusable-workflow permissions are
# capped by this caller's grant.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  audit:
    # _agent-guidance's lockfile-safe copy, not example-site-platform's reusable: a
    # reusable is covered by the lockfile of the repo that defines it, and
    # example-site-platform has none, so since 2026-10-28 calling it from this
    # lockfile repo startup-failed every day (_agent-guidance ADR 0024's
    # 2026-10-31 addendum). A cross-repo reusable takes a full commit sha.
    # The audit script is copied into _agent-guidance too (the adoption
    # kit's DECISIONS C4).
    uses: example-adopter/_agent-guidance/.github/workflows/scheduled-run-health-reusable.yml@0000000000000000000000000000000000000000
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
