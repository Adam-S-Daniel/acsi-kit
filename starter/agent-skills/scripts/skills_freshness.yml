# Configuration for scripts/check_skill_freshness.py, the freshness lint
# (skills-evals#661): every repo file, workflow and secret name a skill cites
# still exists in the repo it names.
#
# The skills it scans are the ones scripts/skills_registries.yml declares; this
# file says which GitHub repo each registry's skills describe, and so where a
# bare path such as `infrastructure/bootstrap/deploy.sh` is looked up.

# registry name -> how its skills' citations resolve.
#   repo:            the GitHub repo the registry lives in (owner/name).
#   bare_paths:      true when a backticked path with no repo named is a claim
#                    about this repo. False for registries of generic skills,
#                    whose `docs/decisions/README.md` means "your repo", not
#                    this one: there only citations that name a repo count.
#   also_resolve_in: further places a bare path may live, as `owner/name` or
#                    `owner/name:prefix/`. A bare path is fresh when it exists
#                    in the registry's repo or in any of these.
registries:
  acsi-agentskills:
    repo: example-adopter/acsi-agentskills
    bare_paths: false
  acsi-agentskills-private:
    repo: example-adopter/acsi-agentskills-private
    bare_paths: false

# Names a sentence may use for a repo, as in "example-site-platform's `docs/OPERATIONS.md`".
# A path right after "<name>'s " is looked up in that repo alone. The fleet spans
# two owners, so each name carries its owner.
repos:
  _agent-guidance: example-adopter/_agent-guidance
  acsi-agentskills: example-adopter/acsi-agentskills
  acsi-agentskills-private: example-adopter/acsi-agentskills-private
  example-site-a: example-adopter/example-site-a
  example-site-platform: example-adopter/example-site-platform
  example-site-b: example-adopter-two/example-site-b
  repo-settings: example-adopter/repo-settings
  skills-evals: example-adopter/skills-evals

# A citation that is right although the lint cannot see it, such as a file each
# consumer generates and never commits, or a file the skill says is gone.
# A waiver that matches nothing is listed in the report, not failed: the
# skills live in other repos and change on their own. Each entry needs `skill`
# (`<registry>/<skill>`), `cite` (the cited text exactly) and a `reason`.
waivers: []
