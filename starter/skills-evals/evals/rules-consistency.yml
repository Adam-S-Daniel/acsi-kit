# The public repositories .github/workflows/rules-consistency.yml checks daily
# with scripts/check_rule_restatements.py against docs/rules.json: the one
# place their names live. Each is shallow-cloned read-only with no token, so
# only PUBLIC repositories belong here: a private one fails the daily run with
# "could not clone". The two listed are repos the kit created for you;
# _agent-guidance is public unless you set VISIBILITY_AGENT_GUIDANCE=private
# (paid plans), and then it must come out of this list. Add your own website
# or other public repo as another `- repo: <owner>/<name>` row. `exclude`
# lists globs, relative to the repository root, of paths that are deliberately
# not this fleet's rules: an append-only history log records what was true
# then (a finding there could never be fixed in place).
repos:
  - repo: example-adopter/_agent-guidance
    exclude:
      - docs/guidance-impact.md
  - repo: example-adopter/acsi-agentskills
    exclude:
      - docs/skill-impact.md
