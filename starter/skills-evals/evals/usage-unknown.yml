# Skills exempt from usage-based pause AND removal. Their recorded use cannot
# be read as their real use, so the eval scope pass (scripts/eval_scope.py)
# treats their use as unknown: it never pauses their fixtures for zero use, it
# resumes any zero-use pause it made for them, the improvement lane never skips
# them for zero use, and retire_skill.py never removes them as unused. Ceiling
# and floor pauses are unaffected.
#
# Remove an entry once its reason is gone; the next scope run can then pause
# the skill again on real data.
#
# Two groups: skills the fleet guidance tells agents to use (their value is not
# how often they are invoked), and example-site-platform skills used in example-adopter-two's
# repos, which no census covers.
skills:
  - skill: finding-unknowns
    reason: "the fleet guidance tells agents to use it; its value is not measured by how often it is invoked"
